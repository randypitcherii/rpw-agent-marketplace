# The uvx-runnable package for this plugin's MCP servers (#2242, #894 slice B).
# Not a uv workspace member: it is built only by uvx/uv build from a git checkout,
# where no .venv or env file exists to leak into the wheel. The excludes below make
# a local `uv build` safe too.
[project]
name = "rpw-mcp"
version = "2026.10.0811"
description = "The rpw MCP aggregator and its backend servers, runnable with uvx"
requires-python = ">=3.10"
dependencies = ["fastmcp>=4.0.0"]

[project.scripts]
rpw-mcp = "rpw_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["rpw_mcp", "mcp-servers"]
exclude = [
    "**/.venv",
    "**/__pycache__",
    "**/uv.lock",
    "**/*.env",
    "**/.env",
    "**/test_*.py",
    "**/live_test_*.py",
    "**/tests",
    "**/node_modules",
]

[tool.hatch.build.targets.wheel.sources]
"mcp-servers" = "rpw_mcp/plugin/mcp-servers"

[tool.hatch.build.targets.sdist]
only-include = ["rpw_mcp", "mcp-servers", "pyproject.toml"]
exclude = ["**/.venv", "**/__pycache__", "**/uv.lock", "**/*.env", "**/.env"]
